{% extends "posts/base.html" %}
{% block content %}
<h1> latest Posts</h1>
<ul>
    {% for post in posts %}
        <li>
            <a href="{% url 'post_detail' post.slug %}">
                {{ post.title }}
            </a>
            <br />
            <small> by {{ posts.author.username }} on {{ post.published_at|date:"M d, Y" }}</small>
        </li>
    {% empty %}
        <li> No posts yet. </li>
    {% endfor %}
</ul>
{% endblock %}
