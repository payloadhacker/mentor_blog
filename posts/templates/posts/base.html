<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mentor Blog</title>
</head>


<body>
  {% if messages %}
  <div class="container mt-3">
    {% for message in messages %}
      <div 
        class="alert alert-{{ message.tags }} alert-dismissible fade show" 
        role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
  <header>
    <h2><a href="{% url 'post_list' %}">Mentor Blog</a></h2>
    <hr>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
