{% extends "posts/base.html" %}
{% block content %}
<article>
  <h1>{{ post.title }}</h1>
  <p><em>By {{ post.author.user.username }} on {{ post.published_at|date:"M d, Y" }}</em></p>
  <div>{{ post.body|linebreaks }}</div>
  <p>
    Tags:
    {% for tag in post.tags.all %}
      <span>#{{ tag.name }}</span>
    {% empty %}
      <span>No tags</span>
    {% endfor %}
  </p>
  <a href="{% url 'post_list' %}">← Back to all posts</a>
</article>
{% endblock %}
